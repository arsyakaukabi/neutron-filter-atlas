# Every data path used by the code. Resolved by filteratlas.common.paths: D(key) for directories, F(name) for files.
# The data root is data/ (override with the FA_DATA environment variable). Classes (data/README.md):
#   upstream/      downloaded from third parties          intermediate/  expensive computed products
#   derived/       atlas, benchmark and analysis tables    curated/       hand-built tables (tracked in git)
# File names are bound to the published data files and their checksums and are kept as they are.

data_root: data

dirs:
  mp: upstream/mp                         # Materials Project: summary table, structures, phonon DOS, force constants
  exfor: upstream/exfor                   # EXFOR .x4 entries (IAEA exfor_master mirror)
  endfb80_hdf5: upstream/endfb80_hdf5     # ENDF/B-VIII.0 NNDC HDF5 (openmc_data_downloader), neutron + photon
  ncrystal_datacmp: upstream/ncrystal_datacmp   # NCrystal published data-comparison plot (qualitative check only)
  nucdata: intermediate/nucdata           # elemental cross-section tables extracted from ENDF/B-VIII.0
  mlip: intermediate/mlip                 # MLIP benchmark phonon DOS, per model
  mlip_sensitivity: intermediate/mlip_sensitivity   # Pb/Bi quasi-harmonic DOS (benchmark diagnostic)
  mlip_atlas: intermediate/mlip_atlas     # SevenNet phonon DOS for the atlas
  mlip_relax_sensitivity: intermediate/mlip_relax_sensitivity   # sensitivity rerun of non-converged relaxations with 2,000 steps (never read by the atlas)
  atlas_eval: intermediate/atlas_eval     # per-compound cache of the SevenNet-DOS evaluation (regenerable)
  relax_sensitivity_eval: intermediate/relax_sensitivity_eval   # the same cache for the relaxation-sensitivity reruns (step 09)
  stage4_transport: intermediate/stage4_transport   # OpenMC slab transport of the shortlist: NCMAT files, cases, raw results
  stage4_dips: intermediate/stage4_dips   # Bragg-dip scans of the shortlist
  stage4_activation: intermediate/stage4_activation   # depletion chain and activation runs of the shortlist
  laptop_gpu_check: intermediate/laptop_gpu_check   # GPU-vs-CPU check DOS (inputs kept for a check, not used by the atlas)
  logs: intermediate/logs                 # run logs read by the code (MLIP status and wall times)

files:
  # curated (tracked in git)
  growable_crystals.csv: curated/growable_crystals.csv
  stage4_dossier.csv: curated/stage4_dossier.csv   # sourced practicality facts of the shortlist
  hygroscopic_families.csv: curated/hygroscopic_families.csv
  exfor_candidates_extra.csv: curated/exfor_candidates_extra.csv
  # intermediate: large per-compound tables read by later steps
  exfor_benchmark.csv: intermediate/exfor_benchmark.csv
  stage1_triviality.parquet: intermediate/stage1_triviality.parquet
  stage1_usable.parquet: intermediate/stage1_usable.parquet
  stage1_dimensionality.parquet: intermediate/stage1_dimensionality.parquet
  stage1r_stability_screen.parquet: intermediate/stage1r_stability_screen.parquet
  stage1r_stability_full.parquet: intermediate/stage1r_stability_full.parquet
  stage1r_stability_full_mesh60.parquet: intermediate/stage1r_stability_full_mesh60.parquet
  stage1r_fc_validation.parquet: intermediate/stage1r_fc_validation.parquet
  stage1r_fc_validation_largecell.parquet: intermediate/stage1r_fc_validation_largecell.parquet
  stage1r_floor_sensitivity.parquet: intermediate/stage1r_floor_sensitivity.parquet
  stage1r_pheasy_vs_dfpt.parquet: intermediate/stage1r_pheasy_vs_dfpt.parquet
  stage3_proxy.parquet: intermediate/stage3_proxy.parquet
  stage3_stability.parquet: intermediate/stage3_stability.parquet
  stage3_debye.parquet: intermediate/stage3_debye.parquet
  stage3_curves.parquet: intermediate/stage3_curves.parquet
  # derived: candidate set, EXFOR summary, model control
