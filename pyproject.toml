[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filteratlas"
version = "0.5.0"
description = "Pipeline of a database-wide atlas of single-crystal thermal-neutron filters"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
# Dependencies are pinned in environment.yml / requirements-lock.txt (NCrystal and OpenMC come from conda-forge).

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
